<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BT Logo 50x50</title>

<style>
  body{
    margin:0;
    background:transparent;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }

  .logo{
    width:50px;
    height:50px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .bt{
    font-size:28px;
    font-weight:900;
    background:linear-gradient(45deg, #ff0000, #ffcc00);
    -webkit-background-clip:text;
    color:transparent;
    position:relative;
    letter-spacing:1px;
    text-shadow:0 0 4px rgba(255,80,0,0.8);
  }

  /* Shine animation */
  .bt::after{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:40%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.9), transparent);
    transform:skewX(-20deg);
    animation:shine 2.5s infinite;
  }

  

.logo::before{
  content:"";
  position:absolute;
  width:46px;
  height:46px;
  border:2px solid yellow;
  border-radius:50%;
  animation: ringRotate 3s linear infinite;
  opacity:0.6;
}



.bt{
  background: linear-gradient(90deg, yellow, orange, red, yellow);
  -webkit-background-clip: text;
  color: transparent;
  animation: grad 3s linear infinite;
  background-size:300%;
}

@keyframes grad{
  0%{ background-position:0%; }
  100%{ background-position:300%; }
}

.bt{
  background: linear-gradient(90deg, yellow, orange, red, yellow);
  -webkit-background-clip: text;
  color: transparent;
  animation: grad 3s linear infinite;
  background-size:300%;
}



.logo{
  animation: pulse 2s infinite;
}




.logo::after{
  content:"";
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:yellow;
  animation: spark 1.2s infinite;
  opacity:0;
}


.logo::before{
  content:"";
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background: radial-gradient(circle, yellow 10%, transparent 11%) 0 0 / 8px 8px repeat;
  animation: rotateDots 2s linear infinite;
}

@keyframes rotateDots{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}
</style>

</head>
<body>

<div class="logo">
  <div class="bt">BT</div>
</div>
</body>
</html>
