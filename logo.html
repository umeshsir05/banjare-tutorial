<!DOCTYPE html>
<html>
<head>
<style>
body{
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.logo{
  width:50px;
  height:50px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:8px;
  position:relative;
}

/* BT text small + animated glow */
.bt{
  font-size:28px;
  font-weight:900;
  letter-spacing:1px;
  background:linear-gradient(45deg, #ff0000, #ffaa00);
  -webkit-background-clip:text;
  color:transparent;
  animation:glow 2s ease-in-out infinite;
}

@keyframes glow{
  0%{ text-shadow:0 0 4px #ff4500; }
  50%{ text-shadow:0 0 10px #ff4500; }
  100%{ text-shadow:0 0 4px #ff4500; }
}
</style>
</head>
<body>

<div class="logo">
  <div class="bt">BT</div>
</div>

</body>
</html>
